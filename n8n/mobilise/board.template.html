<style>
/* Layout: a whiteboard canvas (pan / zoom) of frames: story, decisions, the live n8n node map, guardrails. "Read as page" stacks the same frames. */
:root {
  --canvas: #e9ecf0; --dot: #c9cfd8; --frame: #ffffff; --frame-line: #d3d8df; --ink: #1b2330; --ink-2: #4a5566; --ink-3: #7a8494;
  --accent: #2f5bea; --accent-ink: #ffffff;
  --sticky-y: #fff1a8; --sticky-p: #ffd6e2; --sticky-g: #d4f2d9; --sticky-b: #d6e6ff; --sticky-o: #ffe0bf; --sticky-ink: #2a2a22;
  --ok: #1f8f4e; --warn: #b7791f; --bad: #c93b3b; --info: #2f5bea;
  --k-trigger: #2f5bea; --k-code: #7b4ddb; --k-ai: #e0632b; --k-http: #138a8a; --k-db: #3d5a80; --k-store: #2e8b57; --k-decide: #c98a12; --k-respond: #6b7280; --k-call: #4f46e5;
  --edge: #8a94a6; --shadow: 0 1px 2px rgb(20 30 50 / .08), 0 6px 18px rgb(20 30 50 / .06);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #14171c; --dot: #2a3039; --frame: #1d2128; --frame-line: #323944; --ink: #e8ebf0; --ink-2: #b3bac6; --ink-3: #8790a0;
  --accent: #7d9cff; --accent-ink: #0d1220;
  --sticky-y: #4a4420; --sticky-p: #4d2a36; --sticky-g: #22422b; --sticky-b: #233552; --sticky-o: #4d3620; --sticky-ink: #f1eee0;
  --ok: #4cc27f; --warn: #e0ad4f; --bad: #f07272; --info: #7d9cff;
  --k-trigger: #7d9cff; --k-code: #a98bf0; --k-ai: #f08a57; --k-http: #4cc2c2; --k-db: #8fb0d9; --k-store: #5fc48c; --k-decide: #e0ad4f; --k-respond: #9aa3b2; --k-call: #9c95ff;
  --edge: #6d7686; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .3); color-scheme: dark } }
:root[data-theme="dark"] {
  --canvas: #14171c; --dot: #2a3039; --frame: #1d2128; --frame-line: #323944; --ink: #e8ebf0; --ink-2: #b3bac6; --ink-3: #8790a0;
  --accent: #7d9cff; --accent-ink: #0d1220;
  --sticky-y: #4a4420; --sticky-p: #4d2a36; --sticky-g: #22422b; --sticky-b: #233552; --sticky-o: #4d3620; --sticky-ink: #f1eee0;
  --ok: #4cc27f; --warn: #e0ad4f; --bad: #f07272; --info: #7d9cff;
  --k-trigger: #7d9cff; --k-code: #a98bf0; --k-ai: #f08a57; --k-http: #4cc2c2; --k-db: #8fb0d9; --k-store: #5fc48c; --k-decide: #e0ad4f; --k-respond: #9aa3b2; --k-call: #9c95ff;
  --edge: #6d7686; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .3); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
body.list { overflow: auto; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--frame) 92%, transparent); border-bottom: 1px solid var(--frame-line); backdrop-filter: blur(8px); }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font: 800 16px/1.1 var(--f-display); letter-spacing: .01em; }
.brand span { color: var(--ink-3); font-size: 12px; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--frame-line); background: var(--frame); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select.btn { padding-right: 24px; max-width: 46vw; }
.zoom { font: 500 12px var(--f-mono); color: var(--ink-3); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

/* canvas */
.viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size: 22px 22px; }
.viewport.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
body.list .viewport { position: static; overflow: visible; touch-action: auto; cursor: auto; background-image: none; padding: calc(84px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
body.list .world { position: static; transform: none !important; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; margin: 0 auto; }

/* frames */
.frame { position: absolute; background: var(--frame); border: 1px solid var(--frame-line); border-radius: 6px; box-shadow: var(--shadow); padding: 26px 28px 28px; }
body.list .frame { position: relative; left: auto !important; top: auto !important; width: auto !important; max-width: 100%; }
.frame-tag { position: absolute; top: -26px; left: 0; font: 600 13px var(--f-body); color: var(--ink-2); white-space: nowrap; }
body.list .frame-tag { position: static; display: block; margin-bottom: 6px; }
.frame h2 { font: 800 30px/1.1 var(--f-display); margin: 0 0 6px; text-wrap: balance; letter-spacing: -.005em; }
.frame h3 { font: 700 18px/1.2 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
.frame p { margin: 0 0 10px; max-width: 70ch; color: var(--ink-2); }
.lede { font-size: 16px; color: var(--ink-2); max-width: 72ch; }
.eyebrow { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.col { flex: 1 1 260px; min-width: 0; }

.sticky { background: var(--sticky-y); color: var(--sticky-ink); padding: 14px 16px; border-radius: 2px; box-shadow: 0 2px 0 rgb(0 0 0 / .06), 0 8px 16px rgb(0 0 0 / .07); min-width: 0; }
.sticky.p { background: var(--sticky-p); } .sticky.g { background: var(--sticky-g); } .sticky.b { background: var(--sticky-b); } .sticky.o { background: var(--sticky-o); }
.sticky h4 { margin: 0 0 6px; font: 700 14px/1.25 var(--f-body); }
.sticky ul { margin: 0; padding-left: 18px; } .sticky li { margin: 3px 0; }
.sticky p { color: inherit; opacity: .85; margin: 0; }
.tilt-l { transform: rotate(-0.8deg); } .tilt-r { transform: rotate(0.7deg); }

table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
.t th, .t td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--frame-line); }
.t th { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.scroll { overflow-x: auto; max-width: 100%; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 11px var(--f-mono); letter-spacing: .03em; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--info); }
.mono { font-family: var(--f-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* timeline */
.lanes { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; align-items: stretch; }
.lane-name { font: 700 13px var(--f-body); padding-top: 10px; }
.lane { display: flex; gap: 8px; flex-wrap: wrap; }
.step { flex: 1 1 150px; min-width: 0; border: 1px solid var(--frame-line); border-left: 4px solid var(--edge); border-radius: 4px; padding: 8px 10px; background: color-mix(in srgb, var(--frame) 94%, var(--canvas)); }
.step b { display: block; font-size: 12px; font-family: var(--f-mono); color: var(--ink-3); font-weight: 500; }
.step.today { border-left-color: var(--bad); } .step.vera { border-left-color: var(--ok); }

/* checklist bars */
.areas { display: grid; gap: 8px; }
.area { display: grid; grid-template-columns: 52px 1fr 120px; gap: 10px; align-items: center; }
.area .code { font: 600 12px var(--f-mono); }
.bars { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--canvas); }
.bars i { display: block; height: 100%; }
.area small { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* binding ladder */
.ladder { display: grid; gap: 8px; counter-reset: rung; }
.rung { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--frame-line); border-radius: 6px; }
.rung::before { counter-increment: rung; content: counter(rung); font: 800 20px/1 var(--f-display); color: var(--ink-3); }
.rung h4 { margin: 0 0 3px; font-size: 14px; }
.rung p { margin: 0; font-size: 13px; }

/* accuracy rings */
.rings { width: 100%; max-width: 360px; height: auto; display: block; }

/* overview map */
.ov { position: relative; }
.ovbox { position: absolute; width: 208px; border: 1px solid var(--frame-line); border-radius: 8px; padding: 10px 12px; background: var(--frame); box-shadow: var(--shadow); cursor: pointer; }
.ovbox:hover { border-color: var(--accent); }
.ovbox b { display: block; font: 700 13px/1.25 var(--f-body); }
.ovbox span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.ovbox .id { font: 600 11px var(--f-mono); color: var(--accent); }
.ovbox.actor { background: var(--sticky-b); color: var(--sticky-ink); border-style: dashed; cursor: default; }
.ovbox.actor span { color: inherit; opacity: .8; }

/* n8n nodes */
.wf-canvas { position: relative; }
body.list .wf-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--frame-line); border-radius: 6px; background: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; }
.node { position: absolute; width: 214px; background: var(--frame); border: 1px solid var(--frame-line); border-top: 4px solid var(--kc, var(--edge)); border-radius: 6px; padding: 8px 10px 9px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.node:hover { border-color: var(--accent); border-top-color: var(--kc); }
.node.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.node .type { display: flex; justify-content: space-between; gap: 6px; font: 500 10.5px var(--f-mono); color: var(--kc); text-transform: lowercase; }
.node .nm { display: block; font: 600 13px/1.25 var(--f-body); margin: 3px 0 4px; color: var(--ink); }
.node .ds { display: block; font-size: 11.5px; line-height: 1.35; color: var(--ink-2); }
.node .gd { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.gchip { font: 500 10px var(--f-mono); padding: 1px 5px; border-radius: 3px; background: color-mix(in srgb, var(--g, var(--edge)) 14%, transparent); color: var(--g, var(--ink-2)); }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges path { fill: none; stroke-width: 1.6; }
svg.edges text { font: 500 10px var(--f-mono); fill: var(--ink-3); }

/* side panel */
.panel { position: fixed; z-index: 30; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); width: min(380px, calc(100vw - 24px)); max-height: calc(100% - 90px); overflow: auto;
  background: var(--frame); border: 1px solid var(--frame-line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; }
.panel h3 { margin: 4px 0 6px; font: 700 18px/1.2 var(--f-display); }
.panel dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; margin: 10px 0 0; font-size: 13px; }
.panel dt { color: var(--ink-3); font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.panel dd { margin: 0; min-width: 0; }
.panel .x { position: absolute; right: 10px; top: 10px; }

.legend { display: flex; gap: 10px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c); display: inline-block; }
.ln { width: 22px; height: 0; border-top: 2px solid var(--c); display: inline-block; }
.ln.d { border-top-style: dashed; }

.hint { position: fixed; z-index: 15; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--ink-3); background: var(--frame); border: 1px solid var(--frame-line); border-radius: 8px; padding: 6px 10px; }
body.list .hint { display: none; }

@media (max-width: 640px) {
  .brand span { display: none; }
  .lanes { grid-template-columns: 1fr; }
  .area { grid-template-columns: 44px 1fr; } .area small { grid-column: 2; }
  .frame { padding: 20px 18px; }
  .frame h2 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = /*BOARD_DATA*/null;

// ------------------------------------------------------------------ content
const K = {
  webhook: ['trigger', 'k-trigger'], cron: ['trigger', 'k-trigger'], sub: ['trigger', 'k-trigger'], form: ['trigger', 'k-trigger'], errorTrigger: ['trigger', 'k-trigger'],
  code: ['code', 'k-code'], http: ['http', 'k-http'], pg: ['postgres', 'k-db'], s3: ['s3 store', 'k-store'], if: ['if', 'k-decide'], switch: ['switch', 'k-decide'],
  respond: ['respond', 'k-respond'], exec: ['sub-workflow', 'k-call'], wait: ['wait', 'k-respond'], noop: ['no-op', 'k-respond'], stop: ['stop', 'k-respond'],
  loop: ['loop', 'k-decide'], email: ['email', 'k-http'], merge: ['merge', 'k-decide'],
};
const GUARD = {
  retry: ['retry ×3', '--info', 'Retries 3 times, 5 s apart, before anything is called a failure.'],
  dedupe: ['dedupe', '--ok', 'The same item twice is recognised and processed once.'],
  idempotent: ['safe to repeat', '--ok', 'Running it again gives the same result and stores nothing twice.'],
  'error-out': ['error path', '--bad', 'If this step fails, the item goes down a wired error path. Nothing fails silently.'],
  human: ['person', '--warn', 'A person decides here, or the item goes to the review queue.'],
  schema: ['schema', '--k-code', 'Input or AI output is checked against a fixed shape; anything else is refused.'],
  auth: ['auth', '--k-trigger', 'Only signed, known callers get past this step.'],
  window: ['24 h window', '--k-call', 'Respects WhatsApp’s 24-hour rule: free reply inside it, approved template outside.'],
  timeout: ['timeout', '--info', 'Has a time limit, so a slow service cannot hold the line.'],
  audit: ['audit', '--k-db', 'Writes who did what and when, kept with the evidence.'],
};
const isAI = (n) => /Claude|Sarvam|Transcribe/.test(n.name);

const STORY = [
  { id: 'start', tag: 'Start here', w: 1180, html: () => `
    <div class="eyebrow">Desk 05 · One-day Mobilisation · board v1</div>
    <h2>Open a new site in one day, not three</h2>
    <p class="lede">The contractor sends papers and photos on WhatsApp three days before. Vera checks each paper against the site's own facts and tells him what is missing every evening. On the day, the engineer taps a line, takes the photo and speaks his remark; GPS is stored with each photo. By evening the NOC report is drafted and waits for his signature.</p>
    <div class="row" style="margin-top:16px">
      <div class="sticky col tilt-l"><h4>What this board shows</h4><ul><li>Who uses it, and their day today</li><li>Three decisions: which WhatsApp, how accurate GPS is, who tags each photo to its line</li><li>All 10 n8n workflows, node by node, as they run</li><li>Every failure we planned for and what happens then</li></ul></div>
      <div class="sticky g col"><h4>The rule for the whole desk</h4><p>AI reads: voice notes, handwriting, papers, which line a photo belongs to. Code decides: is the paper valid, is the line closed, is the site ready. The engineer signs. When code cannot decide from what AI read, a person looks. Nothing is guessed.</p></div>
      <div class="sticky b col tilt-r"><h4>Built and checked so far</h4><ul><li><span class="num">${DATA.workflows.length}</span> workflows, <span class="num">${DATA.workflows.reduce((a, w) => a + w.nodes.length, 0)}</span> nodes, one source file</li><li>Checked against n8n's own node definitions: 0 errors</li><li>Imported into n8n 2.44.5 and run against a real database</li><li><span class="num">${DATA.lineCount}</span>-line checklist, template ${DATA.version}</li></ul></div>
    </div>
    <div class="legend" style="margin-top:18px">
      ${Object.entries({ Trigger: 'k-trigger', 'Code (rules)': 'k-code', 'AI call': 'k-ai', Database: 'k-db', 'File store': 'k-store', Decision: 'k-decide', 'Calls a workflow': 'k-call', Reply: 'k-respond' }).map(([l, c]) => `<span><i class="sw" style="--c:var(--${c})"></i>${l}</span>`).join('')}
      <span><i class="ln" style="--c:var(--edge)"></i>next step</span><span><i class="ln" style="--c:var(--ok)"></i>yes</span><span><i class="ln" style="--c:var(--warn)"></i>no / other</span><span><i class="ln d" style="--c:var(--bad)"></i>on error</span>
    </div>` },

  { id: 'people', tag: '1 · Who we are building for', w: 1180, html: () => `
    <h2>Two people at the developer, one at the site</h2>
    <p>The developer's engineer signs the NOC. If something goes wrong later, that signature is what gets asked about. Design wants the site to start on the right drawings and approved schemes. The contractor's team does the sending.</p>
    <div class="row" style="margin-top:14px">
      <div class="sticky o col"><h4>Senior engineer (signs the NOC)</h4>
        <p style="margin-bottom:8px"><b>Today:</b> walks 50 to 100 items over 2 to 3 days, chases papers over email, writes the report the next day.</p>
        <ul><li>Wants papers settled before he travels, not argued at the gate</li><li>Checks details by hand: policy period, sum insured, workers covered, licence capacity vs planned labour</li><li>Gets old or borrowed photos from contractors</li><li>His signature is his liability: he needs proof of what he saw, where and when</li></ul></div>
      <div class="sticky p col tilt-r"><h4>Chief of design</h4>
        <p style="margin-bottom:8px"><b>Today:</b> hears about drawing problems after work has started.</p>
        <ul><li>Site must work from the latest GFC drawings; old ones withdrawn</li><li>Formwork and shoring scheme, mix designs approved by the structural consultant before the first pour</li><li>Crane, batching plant and material routes as per the approved logistics plan</li><li>One standard checklist across projects, changed in one place</li></ul></div>
      <div class="sticky b col tilt-l"><h4>Contractor's site team (sends the evidence)</h4>
        <p style="margin-bottom:8px"><b>Today:</b> forwards PDFs on email and WhatsApp to whoever asks.</p>
        <ul><li>Voice notes in Hindi or Marathi; papers sent from WhatsApp Web</li><li>Weak network in basements and new plots</li><li>Will not install an app or fill a portal</li><li>Needs to know exactly what is still missing, and why a paper came back</li></ul></div>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="col"><h3>What Vera gives each of them</h3>
        <div class="scroll"><table class="t"><tr><th>Person</th><th>Gets</th></tr>
        <tr><td>Engineer</td><td>Papers checked before travel · 7 PM list · on the day: tap, photo, speak · report 80% written · signs with one tap · open items closed on photos</td></tr>
        <tr><td>Design</td><td>8 design-readiness lines (DR-01 to DR-08) on every site · drawing register photo against the design register · checklist versioned, one change applies everywhere</td></tr>
        <tr><td>Contractor</td><td>No app · reply to the area message with photos · one-tap buttons when Vera is unsure · the exact reason when a paper is sent back</td></tr></table></div></div>
    </div>` },

  { id: 'timeline', tag: '2 · The day, before and after', w: 1180, html: () => `
    <h2>Three days of walking and chasing becomes one day</h2>
    <div class="lanes" style="margin-top:14px">
      <div class="lane-name">Today</div>
      <div class="lane">
        <div class="step today"><b>Day −5 to 0</b>Papers chased on email, partly received</div>
        <div class="step today"><b>Day 1–3</b>Engineer walks camp, stores, plant, formwork, safety with a paper checklist</div>
        <div class="step today"><b>Day 4</b>Report typed from notes and photos on his phone</div>
        <div class="step today"><b>Later</b>Re-visit to check fixes</div>
      </div>
      <div class="lane-name">With Vera</div>

    <div class="wf-wrap"><div class="wf-canvas"><svg class="edges"></svg></div></div>` });
  const canvas = el.querySelector('.wf-canvas');
  const nodes = {};
  for (const n of wf.nodes) {
    const [label, kc] = isAI(n) ? ['ai · ' + K[n.kind][0], 'k-ai'] : K[n.kind] || [n.kind, 'edge'];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node';
    b.style.setProperty('--kc', `var(--${kc})`);
    b.innerHTML = `<span class="type"><span>${label}</span>${n.retry ? '<span title="retries">↻</span>' : ''}</span><span class="nm">${esc(n.name)}</span><span class="ds">${esc(n.does)}</span>` +
      (n.guard.length ? `<span class="gd">${n.guard.map((g) => `<span class="gchip" style="--g:var(${(GUARD[g] || [g, '--edge'])[1]})">${(GUARD[g] || [g])[0]}</span>`).join('')}</span>` : '');
    b.addEventListener('click', (e) => { e.stopPropagation(); showNode(wf, n, b) });
    canvas.appendChild(b);
    nodes[n.name] = { n, el: b, col: Math.round((n.x - minX) / 280), y: ((n.y - minY) / 200) * ROWH };
  }
  wfFrames.push({ wf, el, canvas, nodes, width });
}
TAIL.forEach(addFrame);

// After fonts load: stack nodes in a column without overlap, draw edges, lay out frames.
function layoutNodes() {
  for (const F of wfFrames) {
    const byCol = {};
    for (const v of Object.values(F.nodes)) (byCol[v.col] = byCol[v.col] || []).push(v);
    let maxBottom = 0;
    for (const list of Object.values(byCol)) {
      list.sort((a, b) => a.y - b.y);
      let floor = -Infinity;
      for (const v of list) {
        const h = v.el.offsetHeight;
        v.top = Math.max(v.y, floor + 24);
        floor = v.top + h;
        v.h = h;
      }
    }
    for (const v of Object.values(F.nodes)) {
      v.left = v.col * COLW;
      v.el.style.left = v.left + 'px';
      v.el.style.top = v.top + 'px';
      maxBottom = Math.max(maxBottom, v.top + v.h);
    }
    F.canvas.style.width = F.width + 'px';
    F.canvas.style.height = maxBottom + 40 + 'px';
    const svg = F.canvas.querySelector('svg');
    svg.setAttribute('width', F.width);
    svg.setAttribute('height', maxBottom + 40);
    let s = `<defs>${['edge', 'ok', 'warn', 'bad', 'k-call'].map((c) => `<marker id="m-${F.wf.id}-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--${c})"/></marker>`).join('')}</defs>`;
    for (const e of F.wf.edges) {
      const A = F.nodes[e.from], B = F.nodes[e.to];
      if (!A || !B) continue;
      const color = edgeColor(e.kind);
      const cname = color.match(/--([\w-]+)/)[1];
      const ax = A.left + NODEW, ay = A.top + Math.min(A.h / 2, 40), bx = B.left, by = B.top + Math.min(B.h / 2, 40);
      let d;
      if (bx > ax - 4) d = `M${ax},${ay} C${ax + 36},${ay} ${bx - 36},${by} ${bx},${by}`;
      else { const low = Math.max(A.top + A.h, B.top + B.h) + 22; d = `M${A.left + NODEW / 2},${A.top + A.h} C${A.left + NODEW / 2},${low + 30} ${B.left + NODEW / 2},${low + 30} ${B.left + NODEW / 2},${B.top + B.h}` }
      s += `<path d="${d}" stroke="${color}" ${e.kind === 'error' || e.kind === 'Other' ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#m-${F.wf.id}-${cname})"/>`;
      if (!['main', 'in2'].includes(e.kind)) s += `<text x="${ax + 6}" y="${ay - 5}">${esc(e.kind === 'error' ? 'on error' : e.kind)}</text>`;
    }
    svg.innerHTML = s;
  }
}

// Frame positions on the whiteboard
function layoutFrames() {
  const G = 90;
  const place = (ids, x0, y0) => { let x = x0, h = 0; for (const id of ids) { const f = frames.find((q) => q.id === id); f.x = x; f.y = y0; f.el.style.left = x + 'px'; f.el.style.top = y0 + 'px'; x += f.el.offsetWidth + G; h = Math.max(h, f.el.offsetHeight) } return h };
  const placeCol = (ids, x0, y0) => { let y = y0; for (const id of ids) { const f = frames.find((q) => q.id === id); f.x = x0; f.y = y; f.el.style.left = x0 + 'px'; f.el.style.top = y + 'px'; y += f.el.offsetHeight + G } return y };
  let y = 0;
  y += place(['start', 'people'], 0, y) + G + 30;
  y += place(['timeline', 'checklist'], 0, y) + G + 30;
  y += place(['channel', 'gps', 'tagging'], 0, y) + G + 30;
  y += place(['overview', 'guardrails'], 0, y) + G + 30;
  // node maps: WF-01 and WF-02 full width rows, the rest two per row
  const order = ['veraMob01Inbound', 'veraMob09SendWa1', 'veraMob02Process', 'veraMob03WalkApi', 'veraMob06NocRprt', 'veraMob04GapList', 'veraMob05Replies', 'veraMob07Closure', 'veraMob08SetupMb', 'veraMob00Errors1', 'veraMob10ReadPpr', 'veraMob11ShowEvd', 'veraMob12Reviews'].map((x) => 'wf-' + x);
  const rows = [[order[0], order[1]], [order[2]], [order[3]], [order[4], order[10]], [order[5], order[6], order[7]], [order[11], order[12], order[9]], [order[8], 'next']];
  for (const r of rows) y += place(r, 0, y) + G + 30;
}

let S = 1, TX = 0, TY = 0;
const apply = () => { world.style.transform = `translate(${TX}px,${TY}px) scale(${S})`; document.getElementById('zl').textContent = Math.round(S * 100) + '%'; vp.style.backgroundSize = `${22 * S}px ${22 * S}px`; vp.style.backgroundPosition = `${TX}px ${TY}px`; };
const topH = () => document.querySelector('.bar').offsetHeight;
function fitTo(x, y, w, h, pad = 40) {
  const vw = vp.clientWidth, vh = vp.clientHeight - topH();
  S = Math.min(2, Math.max(0.05, Math.min((vw - pad * 2) / w, (vh - pad * 2) / h)));
  TX = (vw - w * S) / 2 - x * S;
  TY = topH() + pad - y * S;
  apply();
}
function bounds(list) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const f of list) { a = Math.min(a, f.x); b = Math.min(b, f.y - 30); c = Math.max(c, f.x + f.el.offsetWidth); d = Math.max(d, f.y + f.el.offsetHeight) }
  return [a, b, c - a, d - b];
}
function goTo(id) {
  const f = frames.find((q) => 'f-' + q.id === id || q.id === id);
  if (!f) return;
  document.getElementById('jump').value = f.id;
  if (document.body.classList.contains('list')) { window.scrollTo({ top: f.el.getBoundingClientRect().top + window.scrollY - topH() - 12, behavior: 'smooth' }); return }
  const [x, y, w, h] = bounds([f]);
  const vw = vp.clientWidth, vh = vp.clientHeight - topH();
  // Whole frame if it fits at a readable size; otherwise readable zoom, anchored at its top-left.
  const fit = Math.min((vw - 60) / w, (vh - 60) / h);
  S = Math.min(1.15, Math.max(fit, Math.min(0.6, (vw - 60) / 900)));
  TX = S * w < vw - 60 ? (vw - w * S) / 2 - x * S : 30 - x * S;
  TY = topH() + 24 - y * S;
  apply();
}
// pan / zoom
const pts = new Map();
let last = null, pinch = null;
vp.addEventListener('pointerdown', (e) => {
  if (document.body.classList.contains('list') || e.target.closest('.node,.ovbox,button,select,a,table')) return;
  vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); vp.classList.add('drag');
  if (pts.size === 2) { const [p, q] = [...pts.values()]; pinch = { d: Math.hypot(p[0] - q[0], p[1] - q[1]), s: S, cx: (p[0] + q[0]) / 2, cy: (p[1] + q[1]) / 2, tx: TX, ty: TY } }
  last = [e.clientX, e.clientY];
});
vp.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2 && pinch) {
    const [p, q] = [...pts.values()];
    const ns = Math.min(2.5, Math.max(0.05, pinch.s * Math.hypot(p[0] - q[0], p[1] - q[1]) / pinch.d));
    TX = pinch.cx - (pinch.cx - pinch.tx) * (ns / pinch.s); TY = pinch.cy - (pinch.cy - pinch.ty) * (ns / pinch.s); S = ns; apply(); return;
  }
  TX += e.clientX - last[0]; TY += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply();
});
const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) vp.classList.remove('drag'); const r = [...pts.values()][0]; if (r) last = r };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
vp.addEventListener('wheel', (e) => {
  if (document.body.classList.contains('list')) return;
  e.preventDefault();
  const mouseWheel = e.deltaMode !== 0 || (Math.abs(e.deltaY) >= 40 && e.deltaX === 0 && Number.isInteger(e.deltaY));
  if (!e.ctrlKey && !mouseWheel) { TX -= e.deltaX; TY -= e.deltaY; apply(); return } // trackpad: pan
  const ns = Math.min(2.5, Math.max(0.05, S * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))));
  TX = e.clientX - (e.clientX - TX) * (ns / S); TY = e.clientY - (e.clientY - TY) * (ns / S); S = ns; apply();
}, { passive: false });
const zoomBy = (k) => { const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2; const ns = Math.min(2.5, Math.max(0.05, S * k)); TX = cx - (cx - TX) * (ns / S); TY = cy - (cy - TY) * (ns / S); S = ns; apply() };
document.getElementById('zin').onclick = () => zoomBy(1.25);
document.getElementById('zout').onclick = () => zoomBy(0.8);
document.getElementById('fit').onclick = () => { const b = bounds(frames); fitTo(...b, 30) };
window.addEventListener('keydown', (e) => { if (e.target.closest('select,input')) return; if (e.key === '+' || e.key === '=') zoomBy(1.2); if (e.key === '-') zoomBy(0.83); if (e.key === 'Escape') panel.hidden = true });

// frame jump
const jump = document.getElementById('jump');
jump.innerHTML = frames.map((f) => `<option value="${f.id}">${esc(f.tag)}</option>`).join('');
jump.addEventListener('change', () => goTo(jump.value));

// node details
const panel = document.getElementById('panel');
function showNode(wf, n, el) {
  document.querySelectorAll('.node.sel').forEach((x) => x.classList.remove('sel'));
  el.classList.add('sel');
  const ins = wf.edges.filter((e) => e.to === n.name).map((e) => e.from + (e.kind !== 'main' && e.kind !== 'in2' ? ' (' + e.kind + ')' : ''));
  const outs = wf.edges.filter((e) => e.from === n.name).map((e) => (e.kind === 'main' ? '' : (e.kind === 'error' ? 'on error' : e.kind) + ' → ') + e.to);
  panel.innerHTML = `<button class="btn x" aria-label="Close">✕</button><div class="eyebrow">${short(wf)} · ${esc(n.type)}</div><h3>${esc(n.name)}</h3><p>${esc(n.does)}</p>
    <dl><dt>Comes from</dt><dd>${ins.length ? ins.map(esc).join('<br>') : 'Starts the workflow'}</dd>
    <dt>Goes to</dt><dd>${outs.length ? outs.map(esc).join('<br>') : 'Ends here'}</dd>
    <dt>If it fails</dt><dd>${n.onError ? 'Item goes down the wired error path.' : n.retry ? 'Retried 3 times; then the error workflow (WF-00) takes over.' : 'The error workflow (WF-00) logs it and alerts Vera ops.'}</dd>
    ${n.guard.length ? `<dt>Guardrails</dt><dd>${n.guard.map((g) => `<b>${esc((GUARD[g] || [g])[0])}</b>: ${esc((GUARD[g] || ['', '', ''])[2])}`).join('<br>')}</dd>` : ''}</dl>`;
  panel.hidden = false;
  panel.querySelector('.x').onclick = () => { panel.hidden = true; el.classList.remove('sel') };
}
vp.addEventListener('click', (e) => { if (!e.target.closest('.node')) { panel.hidden = true; document.querySelectorAll('.node.sel').forEach((x) => x.classList.remove('sel')) } });

// read as page
const modeBtn = document.getElementById('mode');
function setMode(list) {
  document.body.classList.toggle('list', list);
  vp.style.paddingTop = list ? topH() + 20 + 'px' : '';
  modeBtn.classList.toggle('on', list); modeBtn.setAttribute('aria-pressed', String(list)); modeBtn.textContent = list ? 'Whiteboard' : 'Read as page';
  try { localStorage.setItem('mob-board-mode', list ? 'list' : 'board') } catch (e) {}
  if (!list) requestAnimationFrame(() => goTo(jump.value || 'start'));
}
modeBtn.onclick = () => setMode(!document.body.classList.contains('list'));

function start() {
  layoutNodes();
  layoutFrames();
  let m = null;
  try { m = localStorage.getItem('mob-board-mode') } catch (e) {}
  const narrow = window.innerWidth < 700;
  if (m === 'list' || (m === null && narrow)) setMode(true);
  else { const b = bounds(frames.filter((f) => ['start', 'people'].includes(f.id))); fitTo(...b, 30) }
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
window.addEventListener('resize', () => { if (!document.body.classList.contains('list')) apply() });
</script>
