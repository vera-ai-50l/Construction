# Vera n8n server: n8n behind Caddy (automatic HTTPS).
# Copy .env.example to .env on the server, fill it in, then: docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.5 # pinned; bump deliberately
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # keep the execution log small
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      # Desk 05 (n8n/mobilise): Code nodes read $env and use crypto for signatures
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_RUNNERS_ALLOWED_BUILT_IN_MODULES=crypto
      - VERA_WA_APP_SECRET=${VERA_WA_APP_SECRET}
      - VERA_WA_VERIFY_TOKEN=${VERA_WA_VERIFY_TOKEN}
      - VERA_WA_PHONE_NUMBER_ID=${VERA_WA_PHONE_NUMBER_ID}
      - VERA_WALK_SECRET=${VERA_WALK_SECRET}
      - VERA_WALK_URL=${VERA_WALK_URL}
      - VERA_FILES_URL=${VERA_FILES_URL}
      - VERA_S3_BUCKET=${VERA_S3_BUCKET}
      - VERA_GOTENBERG_URL=http://gotenberg:3000
      - VERA_OPS_EMAIL=${VERA_OPS_EMAIL}
      - VERA_OPS_FROM=${VERA_OPS_FROM}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - '5678'
    logging: &logs
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # HTML -> PDF for the Desk 05 NOC report. Internal only (no published port).
  gotenberg:
    image: gotenberg/gotenberg:8.17.3 # pinned; bump deliberately
    container_name: gotenberg
    restart: unless-stopped
    expose:
      - '3000'
    logging: *logs

  caddy:
    image: caddy:2.10.2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [n8n]
    logging: *logs

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
